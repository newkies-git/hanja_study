<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stroke_entities.json 검증 뷰어</title>
  <style>
    :root {
      --bg: #1a1b1e;
      --panel: #25262b;
      --text: #e6e6e6;
      --muted: #909296;
      --warn: #fcc419;
      --bad: #ff6b6b;
      --ok: #51cf66;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid #373a40;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    header .hint {
      font-size: 0.8rem;
      color: var(--muted);
      max-width: 48rem;
      line-height: 1.45;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(240px, 280px) 1fr;
      gap: 0;
      min-height: 0;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
    .sidebar {
      background: var(--panel);
      border-right: 1px solid #373a40;
      padding: 0.75rem;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.25rem; }
    select, input[type="file"], button {
      width: 100%;
      padding: 0.45rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #373a40;
      background: #2c2e33;
      color: var(--text);
      font-size: 0.875rem;
    }
    button {
      cursor: pointer;
      background: #373a40;
    }
    button:hover { background: #424448; }
    button.primary { background: #1864ab; border-color: #1864ab; }
    button.primary:hover { background: #1c7ed6; }
    .nav-row { display: flex; gap: 0.5rem; }
    .nav-row button { flex: 1; }
    .checks {
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .checks ul { margin: 0.25rem 0 0; padding-left: 1.1rem; }
    .checks .ok { color: var(--ok); }
    .checks .warn { color: var(--warn); }
    .checks .bad { color: var(--bad); }
    .stage-wrap {
      padding: 1rem;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.25rem;
      max-width: 900px;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .meta strong { color: var(--text); }
    .viz-block {
      background: #2c2e33;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      border: 1px solid #373a40;
    }
    .viz-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .viz-note {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0.5rem 0 0;
      line-height: 1.4;
    }
    #svgMainHost svg {
      display: block;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
      max-width: 100%;
      height: auto;
    }
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      font-size: 0.85rem;
    }
    .toggles label { display: inline-flex; align-items: center; gap: 0.35rem; margin: 0; cursor: pointer; }
    .toggles input { width: auto; }
    .empty {
      color: var(--muted);
      padding: 2rem;
      text-align: center;
      background: #fff;
      border-radius: 8px;
    }
    .stroke-controls {
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #373a40;
    }
    .stroke-controls[hidden] { display: none !important; }
    .stroke-controls-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .stroke-controls-row button { flex: 1; }
    .stroke-step-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>stroke_entities 검증 뷰어</h1>
    <p class="hint">
      글자는 공통 좌표인 <code>svg_paths</code>로 표시합니다. 같은 폴더 JSON은 <code>python -m http.server 8765</code> 후 열거나 파일 선택을 사용하세요.
    </p>
  </header>
  <main>
    <aside class="sidebar">
      <div>
        <label for="fileInput">JSON 파일</label>
        <input id="fileInput" type="file" accept=".json,application/json" />
      </div>
      <button type="button" class="primary" id="btnReload">같은 폴더 stroke_entities.json 다시 fetch</button>
      <div>
        <label for="charSelect">한자</label>
        <select id="charSelect" disabled></select>
      </div>
      <div class="nav-row">
        <button type="button" id="btnPrev" disabled>이전</button>
        <button type="button" id="btnNext" disabled>다음</button>
      </div>
      <div class="toggles" style="flex-direction:column;align-items:flex-start;">
        <label><input type="checkbox" id="chkSvgColors" checked /> svg_paths 획별 색</label>
        <label><input type="checkbox" id="chkViewBoxGrid" /> viewBox 모눈 (0~512)</label>
        <label><input type="checkbox" id="chkPathBboxRect" /> 합산 bbox (뷰 좌표)</label>
      </div>
      <section class="checks" id="checkPanel" aria-live="polite">
        <div class="muted">데이터를 불러오면 검사 결과가 여기에 표시됩니다.</div>
      </section>
    </aside>
    <div class="stage-wrap">
      <div class="meta" id="metaLine"></div>
      <div class="viz-block">
        <div class="viz-title">글자 (svg_paths · 공통 좌표)</div>
        <div class="stroke-controls" id="strokeControls" hidden>
          <div class="stroke-controls-row">
            <button type="button" class="primary" id="btnStrokeSim">시뮬레이션</button>
            <button type="button" id="btnStrokeReset">초기화</button>
          </div>
          <div class="stroke-controls-row nav-row">
            <button type="button" id="btnStrokePrev">획 이전</button>
            <button type="button" id="btnStrokeNext">획 이후</button>
          </div>
          <p class="stroke-step-label" id="strokeStepLabel"></p>
        </div>
        <div id="svgMainHost"></div>
        <p class="viz-note" id="svgMainNote"></p>
      </div>
    </div>
  </main>
  <script>
(function () {
  const VIEW = 512;
  const GRID_DIVISIONS = 16;
  const NS = 'http://www.w3.org/2000/svg';
  const COLORS = [
    '#e03131', '#2f9e44', '#1971c2', '#ae3ec9', '#f08c00',
    '#0c8599', '#c2255c', '#5c940d', '#7048e8', '#e67700',
    '#1098ad', '#d6336c', '#37b24d', '#4263eb', '#fd7e14'
  ];

  let entities = [];
  let index = 0;
  /** 누적 표시: 1..n 획까지 보임. 0이면 없음. */
  let revealedStrokeCount = 0;
  let simulationTimer = null;
  const SIMULATION_INTERVAL_MS = 580;

  const fileInput = document.getElementById('fileInput');
  const charSelect = document.getElementById('charSelect');
  const btnReload = document.getElementById('btnReload');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const chkSvgColors = document.getElementById('chkSvgColors');
  const chkViewBoxGrid = document.getElementById('chkViewBoxGrid');
  const chkPathBboxRect = document.getElementById('chkPathBboxRect');
  const checkPanel = document.getElementById('checkPanel');
  const metaLine = document.getElementById('metaLine');
  const svgMainHost = document.getElementById('svgMainHost');
  const svgMainNote = document.getElementById('svgMainNote');
  const strokeControls = document.getElementById('strokeControls');
  const strokeStepLabel = document.getElementById('strokeStepLabel');
  const btnStrokeSim = document.getElementById('btnStrokeSim');
  const btnStrokeReset = document.getElementById('btnStrokeReset');
  const btnStrokePrev = document.getElementById('btnStrokePrev');
  const btnStrokeNext = document.getElementById('btnStrokeNext');

  function getStrokeCount(ent) {
    if (!ent) return 0;
    const paths = ent.svg_paths;
    if (Array.isArray(paths) && paths.length > 0) return paths.length;
    const strokes = ent.strokes;
    return Array.isArray(strokes) ? strokes.length : 0;
  }

  function stopStrokeSimulation() {
    if (simulationTimer != null) {
      clearInterval(simulationTimer);
      simulationTimer = null;
    }
    btnStrokeSim.textContent = '시뮬레이션';
  }

  function isSimulationRunning() {
    return simulationTimer != null;
  }

  function applyStrokeVisibility() {
    const max = getStrokeCount(entities[index]);
    const n = Math.max(0, Math.min(revealedStrokeCount, max));
    svgMainHost.querySelectorAll('path[data-stroke-order]').forEach((pathEl) => {
      const ord = parseInt(pathEl.getAttribute('data-stroke-order'), 10);
      const show = Number.isFinite(ord) && ord <= n;
      pathEl.setAttribute('opacity', show ? '1' : '0');
      pathEl.setAttribute('visibility', show ? 'visible' : 'hidden');
    });
  }

  function updateStrokeControls() {
    const ent = entities[index];
    const max = getStrokeCount(ent);
    if (max === 0) {
      strokeControls.hidden = true;
      return;
    }
    strokeControls.hidden = false;
    const n = Math.max(0, Math.min(revealedStrokeCount, max));
    if (n === 0) {
      strokeStepLabel.textContent = '표시된 획 없음 (누적 0 / ' + max + ')';
    } else if (n >= max) {
      strokeStepLabel.textContent = '전체 표시 (누적 1~' + max + ' · ' + max + '획)';
    } else {
      strokeStepLabel.textContent = '누적 표시: 1~' + n + ' 획 · ' + n + ' / ' + max;
    }
    btnStrokePrev.disabled = n <= 0;
    btnStrokeNext.disabled = n >= max;
    btnStrokeSim.disabled = false;
  }

  function startStrokeSimulation() {
    const max = getStrokeCount(entities[index]);
    if (max === 0) return;
    stopStrokeSimulation();
    revealedStrokeCount = 0;
    applyStrokeVisibility();
    updateStrokeControls();

    function stepForward() {
      if (revealedStrokeCount >= max) {
        stopStrokeSimulation();
        updateStrokeControls();
        return;
      }
      revealedStrokeCount++;
      applyStrokeVisibility();
      updateStrokeControls();
    }

    stepForward();
    simulationTimer = setInterval(stepForward, SIMULATION_INTERVAL_MS);
    btnStrokeSim.textContent = '중지';
  }

  function toggleStrokeSimulation() {
    if (isSimulationRunning()) {
      stopStrokeSimulation();
      updateStrokeControls();
      return;
    }
    startStrokeSimulation();
  }

  function hueForOrder(order) {
    return COLORS[(order - 1) % COLORS.length];
  }

  function validateEntity(ent) {
    const issues = [];
    const ok = [];

    if (!ent || typeof ent !== 'object') {
      issues.push({ level: 'bad', text: '항목이 객체가 아닙니다.' });
      return { ok, issues };
    }
    if (typeof ent.char !== 'string' || ent.char.length === 0) {
      issues.push({ level: 'warn', text: 'char가 비어 있거나 없습니다.' });
    } else {
      ok.push('char 있음');
    }
    const ts = ent.total_strokes;
    const strokes = Array.isArray(ent.strokes) ? ent.strokes : null;
    const svgPaths = Array.isArray(ent.svg_paths) ? ent.svg_paths : null;

    if (strokes == null) {
      issues.push({ level: 'bad', text: 'strokes 배열이 없습니다.' });
      return { ok, issues };
    }

    if (typeof ts !== 'number' || !Number.isFinite(ts) || ts < 0) {
      issues.push({ level: 'warn', text: 'total_strokes가 유효한 숫자가 아닙니다.' });
    } else if (ts !== strokes.length) {
      issues.push({
        level: 'warn',
        text: `strokes 개수(${strokes.length})와 total_strokes(${ts}) 불일치`
      });
    } else {
      ok.push('total_strokes === strokes.length');
    }

    if (svgPaths != null && typeof ts === 'number' && ts > 0 && svgPaths.length !== ts) {
      issues.push({
        level: 'warn',
        text: `svg_paths 길이(${svgPaths.length})와 total_strokes(${ts}) 불일치`
      });
    } else if (svgPaths != null && svgPaths.length === strokes.length) {
      ok.push('svg_paths 길이 === strokes.length');
    }

    strokes.forEach((s, i) => {
      const ord = s && s.order;
      if (typeof ord !== 'number') {
        issues.push({ level: 'bad', text: `strokes[${i}]: order 없음` });
      } else if (ord !== i + 1) {
        issues.push({
          level: 'warn',
          text: `strokes[${i}]: order=${ord}, 기대=${i + 1}`
        });
      }
      const pts = s && s.points;
      if (!Array.isArray(pts) || pts.length === 0) {
        issues.push({ level: 'bad', text: `strokes[${i}]: points 비어 있음` });
      } else if (pts.length < 2) {
        issues.push({ level: 'warn', text: `strokes[${i}]: points 1개뿐(선분 불가)` });
      } else {
        const badPt = pts.find(
          (p) =>
            !Array.isArray(p) ||
            p.length < 2 ||
            !Number.isFinite(p[0]) ||
            !Number.isFinite(p[1])
        );
        if (badPt) {
          issues.push({ level: 'bad', text: `strokes[${i}]: 잘못된 좌표 항목` });
        }
      }
    });

    const orders = strokes.map((s) => s && s.order).filter((n) => typeof n === 'number');
    const uniq = new Set(orders);
    if (orders.length !== uniq.size) {
      issues.push({ level: 'warn', text: 'order 값 중복' });
    }

    return { ok, issues };
  }

  function renderCheckPanel(ent) {
    const { ok, issues } = validateEntity(ent);
    const lines = [];
    if (ok.length) {
      lines.push('<div class="ok">통과</div><ul>');
      ok.forEach((t) => lines.push(`<li class="ok">${escapeHtml(t)}</li>`));
      lines.push('</ul>');
    }
    if (issues.length) {
      lines.push('<div class="warn" style="margin-top:0.5rem">점검</div><ul>');
      issues.forEach(({ level, text }) => {
        const cls = level === 'bad' ? 'bad' : 'warn';
        lines.push(`<li class="${cls}">${escapeHtml(text)}</li>`);
      });
      lines.push('</ul>');
    }
    if (!ok.length && !issues.length) {
      lines.push('<span class="muted">검사할 내용 없음</span>');
    }
    checkPanel.innerHTML = lines.join('');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function bboxFromSvgPaths(paths) {
    if (!paths || !paths.length) return null;
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    const numRe = /-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
    paths.forEach((d) => {
      if (typeof d !== 'string') return;
      let m;
      const re = new RegExp(numRe.source, 'g');
      const nums = [];
      while ((m = re.exec(d)) !== null) nums.push(parseFloat(m[0]));
      for (let i = 0; i + 1 < nums.length; i += 2) {
        const x = nums[i];
        const y = nums[i + 1];
        if (Number.isFinite(x) && Number.isFinite(y)) {
          minX = Math.min(minX, x);
          maxX = Math.max(maxX, x);
          minY = Math.min(minY, y);
          maxY = Math.max(maxY, y);
        }
      }
    });
    if (!Number.isFinite(minX)) return null;
    return { minX, minY, maxX, maxY };
  }

  /** path 좌표 → 현재 뷰 viewBox(0~VIEW) 상의 픽셀 */
  function pathPointToViewXY(px, py, tx, ty, scale, flipY) {
    return {
      x: tx + scale * px,
      y: ty + scale * (flipY - py),
    };
  }

  function appendViewBoxGridLayer(svg) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'overlay-viewbox-grid');
    g.setAttribute('pointer-events', 'none');
    for (let i = 1; i < GRID_DIVISIONS; i++) {
      const pos = (VIEW * i) / GRID_DIVISIONS;
      const major = i % 4 === 0;
      const strokeColor = major ? '#adb5bd' : '#dee2e6';
      const sw = major ? 0.65 : 0.4;
      const vLine = document.createElementNS(NS, 'line');
      vLine.setAttribute('x1', String(pos));
      vLine.setAttribute('x2', String(pos));
      vLine.setAttribute('y1', '0');
      vLine.setAttribute('y2', String(VIEW));
      vLine.setAttribute('stroke', strokeColor);
      vLine.setAttribute('stroke-width', String(sw));
      g.appendChild(vLine);
      const hLine = document.createElementNS(NS, 'line');
      hLine.setAttribute('x1', '0');
      hLine.setAttribute('x2', String(VIEW));
      hLine.setAttribute('y1', String(pos));
      hLine.setAttribute('y2', String(pos));
      hLine.setAttribute('stroke', strokeColor);
      hLine.setAttribute('stroke-width', String(sw));
      g.appendChild(hLine);
    }
    const border = document.createElementNS(NS, 'rect');
    border.setAttribute('x', '0');
    border.setAttribute('y', '0');
    border.setAttribute('width', String(VIEW));
    border.setAttribute('height', String(VIEW));
    border.setAttribute('fill', 'none');
    border.setAttribute('stroke', '#868e96');
    border.setAttribute('stroke-width', '1.25');
    g.appendChild(border);
    const labelFs = 9;
    const labels = [0, VIEW / 2, VIEW];
    labels.forEach((x) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', String(x));
      t.setAttribute('y', String(VIEW - 4));
      t.setAttribute('fill', '#868e96');
      t.setAttribute('font-size', String(labelFs));
      t.setAttribute('text-anchor', x === 0 ? 'start' : x === VIEW ? 'end' : 'middle');
      t.textContent = String(Math.round(x));
      g.appendChild(t);
    });
    labels.forEach((y) => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', '4');
      t.setAttribute('y', String(y + 3));
      t.setAttribute('fill', '#868e96');
      t.setAttribute('font-size', String(labelFs));
      t.setAttribute('text-anchor', 'start');
      t.setAttribute('dominant-baseline', 'middle');
      t.textContent = String(Math.round(y));
      g.appendChild(t);
    });
    svg.appendChild(g);
  }

  function pathBoxToViewRect(box, tx, ty, scale, flipY) {
    const corners = [
      pathPointToViewXY(box.minX, box.minY, tx, ty, scale, flipY),
      pathPointToViewXY(box.maxX, box.minY, tx, ty, scale, flipY),
      pathPointToViewXY(box.maxX, box.maxY, tx, ty, scale, flipY),
      pathPointToViewXY(box.minX, box.maxY, tx, ty, scale, flipY),
    ];
    const xs = corners.map((p) => p.x);
    const ys = corners.map((p) => p.y);
    const vx = Math.min(...xs);
    const vy = Math.min(...ys);
    return {
      vx,
      vy,
      vw: Math.max(...xs) - vx,
      vh: Math.max(...ys) - vy,
    };
  }

  function appendPathBboxLayer(svg, box, tx, ty, scale, flipY) {
    if (!box) return;
    const { vx, vy, vw, vh } = pathBoxToViewRect(box, tx, ty, scale, flipY);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'overlay-path-bbox');
    g.setAttribute('pointer-events', 'none');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', String(vx));
    rect.setAttribute('y', String(vy));
    rect.setAttribute('width', String(vw));
    rect.setAttribute('height', String(vh));
    rect.setAttribute('fill', 'rgba(253,126,20,0.06)');
    rect.setAttribute('stroke', '#fd7e14');
    rect.setAttribute('stroke-width', '1.5');
    rect.setAttribute('stroke-dasharray', '5 4');
    rect.setAttribute('vector-effect', 'non-scaling-stroke');
    g.appendChild(rect);
    svg.appendChild(g);
  }

  function renderMainSvgPaths(ent) {
    svgMainHost.innerHTML = '';
    const paths = ent.svg_paths;
    if (!Array.isArray(paths) || paths.length === 0) {
      svgMainHost.innerHTML =
        '<div class="empty">svg_paths 없음 — 글자 실루엣은 JSON에 경로가 있을 때만 표시됩니다.</div>';
      svgMainNote.textContent = '';
      return;
    }

    const box = bboxFromSvgPaths(paths);
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', String(VIEW));
    svg.setAttribute('height', String(VIEW));
    svg.setAttribute('viewBox', `0 0 ${VIEW} ${VIEW}`);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `${ent.char} svg_paths`);

    let tx = 0;
    let ty = 0;
    let scale = 1;
    let flipY = 0;
    if (box) {
      const w = box.maxX - box.minX || 1;
      const h = box.maxY - box.minY || 1;
      scale = Math.min(VIEW / w, VIEW / h) * 0.92;
      tx = (VIEW - w * scale) / 2 - box.minX * scale;
      ty = (VIEW - h * scale) / 2 - box.minY * scale;
      flipY = box.minY + box.maxY;
    }

    if (chkViewBoxGrid.checked) {
      appendViewBoxGridLayer(svg);
    }
    if (chkPathBboxRect.checked && box) {
      appendPathBboxLayer(svg, box, tx, ty, scale, flipY);
    }

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'stroke-paths');
    if (box) {
      g.setAttribute(
        'transform',
        `translate(${tx},${ty}) scale(${scale}) translate(0,${flipY}) scale(1,-1)`
      );
    }

    paths.forEach((d, i) => {
      if (typeof d !== 'string' || !d.trim()) return;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', 'none');
      const stroke = chkSvgColors.checked ? hueForOrder(i + 1) : '#1a1a1a';
      path.setAttribute('stroke', stroke);
      path.setAttribute('stroke-width', '2');
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      path.setAttribute('data-stroke-order', String(i + 1));
      g.appendChild(path);
    });
    svg.appendChild(g);
    svgMainHost.appendChild(svg);
    let note = `획 ${paths.length}개 · viewBox 0 0 ${VIEW} ${VIEW}`;
    if (box) {
      note += ` · path bbox [${Math.round(box.minX)}, ${Math.round(box.minY)}]—[${Math.round(box.maxX)}, ${Math.round(box.maxY)}]`;
      if (chkPathBboxRect.checked) {
        const r = pathBoxToViewRect(box, tx, ty, scale, flipY);
        note += ` → 뷰 rect (${Math.round(r.vx)}, ${Math.round(r.vy)}) ${Math.round(r.vw)}×${Math.round(r.vh)}`;
      }
    }
    svgMainNote.textContent = note;
  }

  function renderViz(ent, options) {
    const resetStrokeReveal = options && options.resetStrokeReveal === true;
    if (!ent) {
      metaLine.textContent = '';
      svgMainHost.innerHTML = '';
      stopStrokeSimulation();
      strokeControls.hidden = true;
      return;
    }

    metaLine.innerHTML = `<strong>${escapeHtml(ent.char)}</strong> · stroke_data_id: <code>${escapeHtml(String(ent.stroke_data_id ?? ''))}</code> · total_strokes: ${ent.total_strokes ?? '—'} · strokes: ${(ent.strokes || []).length}`;

    if (resetStrokeReveal) {
      stopStrokeSimulation();
      revealedStrokeCount = getStrokeCount(ent);
    }

    renderMainSvgPaths(ent);
    applyStrokeVisibility();
    updateStrokeControls();
  }

  function setIndex(i) {
    if (!entities.length) return;
    index = (i + entities.length) % entities.length;
    charSelect.value = String(index);
    const ent = entities[index];
    renderCheckPanel(ent);
    renderViz(ent, { resetStrokeReveal: true });
    btnPrev.disabled = entities.length < 2;
    btnNext.disabled = entities.length < 2;
  }

  function populateSelect() {
    charSelect.innerHTML = '';
    entities.forEach((e, i) => {
      const opt = document.createElement('option');
      opt.value = String(i);
      const ch = e.char || '?';
      const id = e.stroke_data_id ?? '';
      opt.textContent = `${i + 1}. ${ch} (${id})`;
      charSelect.appendChild(opt);
    });
    charSelect.disabled = entities.length === 0;
  }

  function loadData(data) {
    if (!Array.isArray(data)) {
      checkPanel.innerHTML = '<div class="bad">루트가 배열이 아닙니다.</div>';
      entities = [];
      populateSelect();
      svgMainHost.innerHTML = '<p class="empty">유효한 배열이 아닙니다.</p>';
      metaLine.textContent = '';
      stopStrokeSimulation();
      strokeControls.hidden = true;
      return;
    }
    entities = data;
    populateSelect();
    if (entities.length === 0) {
      checkPanel.innerHTML = '<div class="warn">빈 배열입니다.</div>';
      svgMainHost.innerHTML = '<p class="empty">항목 없음</p>';
      metaLine.textContent = '';
      stopStrokeSimulation();
      strokeControls.hidden = true;
      return;
    }
    setIndex(0);
  }

  async function tryFetchDefault() {
    try {
      const res = await fetch('stroke_entities.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(String(res.status));
      const data = await res.json();
      loadData(data);
    } catch (e) {
      checkPanel.innerHTML =
        '<div class="warn">자동 로드 실패: ' +
        escapeHtml(e.message || String(e)) +
        '</div><p class="muted" style="font-size:0.8rem;margin:0.5rem 0 0;">파일 선택으로 JSON을 지정하거나 로컬 HTTP 서버로 이 폴더를 여세요.</p>';
      entities = [];
      populateSelect();
      svgMainHost.innerHTML = '';
      metaLine.textContent = '';
      stopStrokeSimulation();
      strokeControls.hidden = true;
    }
  }

  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        loadData(JSON.parse(reader.result));
      } catch (e) {
        checkPanel.innerHTML =
          '<div class="bad">JSON 파싱 오류: ' + escapeHtml(e.message) + '</div>';
      }
    };
    reader.readAsText(f, 'UTF-8');
  });

  btnReload.addEventListener('click', tryFetchDefault);
  charSelect.addEventListener('change', () => setIndex(parseInt(charSelect.value, 10) || 0));
  btnPrev.addEventListener('click', () => setIndex(index - 1));
  btnNext.addEventListener('click', () => setIndex(index + 1));
  function onSvgOptionChange() {
    if (entities[index]) renderViz(entities[index], { resetStrokeReveal: false });
  }
  chkSvgColors.addEventListener('change', onSvgOptionChange);
  chkViewBoxGrid.addEventListener('change', onSvgOptionChange);
  chkPathBboxRect.addEventListener('change', onSvgOptionChange);

  btnStrokeSim.addEventListener('click', () => toggleStrokeSimulation());
  btnStrokeReset.addEventListener('click', () => {
    stopStrokeSimulation();
    revealedStrokeCount = 0;
    applyStrokeVisibility();
    updateStrokeControls();
  });
  btnStrokePrev.addEventListener('click', () => {
    stopStrokeSimulation();
    revealedStrokeCount = Math.max(0, revealedStrokeCount - 1);
    applyStrokeVisibility();
    updateStrokeControls();
  });
  btnStrokeNext.addEventListener('click', () => {
    stopStrokeSimulation();
    const max = getStrokeCount(entities[index]);
    revealedStrokeCount = Math.min(max, revealedStrokeCount + 1);
    applyStrokeVisibility();
    updateStrokeControls();
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.target.matches('input,select,textarea')) return;
    if (ev.key === 'ArrowLeft') setIndex(index - 1);
    if (ev.key === 'ArrowRight') setIndex(index + 1);
  });

  tryFetchDefault();
})();
  </script>
</body>
</html>
