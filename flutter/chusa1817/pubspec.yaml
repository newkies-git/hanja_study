name: chusa1817
description: "추사1817 - 한국 중·고등학교 교육용 기초 한자 1,817자 학습 앱"
publish_to: "none"
version: 1.0.99+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── UI ────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # ── 상태 관리 ─────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.1.0

  # ── 라우팅 ────────────────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ── 로컬 DB (Drift / SQLite) ──────────────────────────────────────────────
  drift: ^2.23.1
  # 0.6.0+eol은 코드/바이너리가 제거된 EOL 버전이라 Android에서 libsqlite3.so가 포함되지 않는다.
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── 네트워크 ──────────────────────────────────────────────────────────────

  # ── 앱 설정 로컬 저장 ─────────────────────────────────────────────────────
  shared_preferences: ^2.3.5

  # ── UUID 생성 ────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  google_sign_in: ^6.2.1
  path_drawing: ^1.0.1
  package_info_plus: ^8.1.3
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6

  # ── 로컬 알림 ─────────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── 코드 생성 ─────────────────────────────────────────────────────────────
  drift_dev: ^2.23.1
  build_runner: ^2.4.15
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/brush_icon_design.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/brush_icon_design.png"
  # 지원 타깃: iOS·Android만 (웹은 Drift 네이티브 SQLite / dart:ffi 미지원).
