name: chusa1817
description: "한자정습 - 한국 중·고등학교 교육용 기초 한자 1,800자 학습 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── UI ────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # ── 상태 관리 ─────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.1.0

  # ── 라우팅 ────────────────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ── 로컬 DB (Drift / SQLite) ──────────────────────────────────────────────
  drift: ^2.23.1
  # 0.6.0+eol은 코드/바이너리가 제거된 EOL 버전이라 Android에서 libsqlite3.so가 포함되지 않는다.
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── 네트워크 ──────────────────────────────────────────────────────────────

  # ── 앱 설정 로컬 저장 ─────────────────────────────────────────────────────
  shared_preferences: ^2.3.5

  # ── UUID 생성 ────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_auth: ^6.3.0
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── 코드 생성 ─────────────────────────────────────────────────────────────
  drift_dev: ^2.23.1
  build_runner: ^2.4.15
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true
  # 지원 타깃: iOS·Android만 (웹은 Drift 네이티브 SQLite / dart:ffi 미지원).
