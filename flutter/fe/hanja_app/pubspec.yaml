name: hanja_app
description: "한자정습 - 한국 중·고등학교 교육용 기초 한자 1,800자 학습 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # ── UI ────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # ── 상태 관리 ─────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── 라우팅 ────────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── 로컬 DB (Drift / SQLite) ──────────────────────────────────────────────
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── 네트워크 ──────────────────────────────────────────────────────────────
  dio: ^5.8.0

  # ── SVG (획순 애니메이션 렌더링) ──────────────────────────────────────────
  flutter_svg: ^2.0.17

  # ── 앱 설정 로컬 저장 ─────────────────────────────────────────────────────
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── 코드 생성 ─────────────────────────────────────────────────────────────
  drift_dev: ^2.23.1
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
